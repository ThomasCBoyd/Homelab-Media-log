
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic Comcast Collection</title>
<style>
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;padding:12px 9px 90px;background:linear-gradient(135deg,#061739,#12458d) fixed;color:white;font:14px Arial,sans-serif}
main{max-width:1050px;margin:auto}
header,.card{border:1px solid #e7bb4c;border-radius:12px;background:#10366e;margin-bottom:12px;overflow:hidden}
header{padding:16px}
h1{color:#ffd15a;margin:0 0 10px;font-size:27px}
h2{font-size:16px;margin:0}
.muted{color:#bed8ef;font-size:12px}
.tools{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.tools input{flex:1 0 100%;min-width:0;padding:12px;border-radius:7px;border:0;font-size:15px}
button{background:#ffd15a;color:#072047;border:0;border-radius:7px;padding:10px;font-weight:bold;cursor:pointer}
button:focus-visible{outline:2px solid white;outline-offset:2px}
.view-switch{display:flex;gap:8px;margin:12px 0}
.view-switch button{flex:1;background:#10366e;color:white;border:1px solid #ffd15a}
.view-switch button.active{background:#ffd15a;color:#061739}
.cardhead{display:flex;align-items:center;gap:9px;padding:13px;background:#0a2a5d;cursor:pointer}
.channelnum{font-size:23px;font-weight:bold;color:#ffd15a;min-width:35px}
.grow{flex:1;min-width:0}
.grow h2{margin:0 0 3px}
.arrow{color:#ffd15a}
.row,.child{display:grid;grid-template-columns:minmax(0,1fr) 38px 38px 38px 42px;gap:5px;align-items:center;padding:8px;border-top:1px solid #315b90}
.heading{font-size:10px;color:#c5def3;text-align:center}
.heading span:first-child{text-align:left}
.title{background:transparent;color:white;text-align:left;padding:2px;font-weight:normal;overflow-wrap:anywhere;min-width:0}
.title strong{font-size:13px}
.center{text-align:center}
.center input{width:17px;height:17px;accent-color:#ffd15a}
.mini{font-size:11px;padding:6px}
.children{margin:3px 4px 8px 12px;border-left:2px solid #e7bb4c;background:#092751}
.child{font-size:12px}
.childname{background:transparent;color:white;text-align:left;padding:3px;overflow-wrap:anywhere;font-weight:600}
.actions{padding:10px;display:flex;gap:7px;flex-wrap:wrap}
.empty{padding:14px;color:#c6dff5}
.posterline{display:flex;align-items:center;gap:9px;min-width:0}
.posterline>div:last-child{min-width:0}
.poster{width:48px;height:72px;object-fit:cover;border-radius:4px;border:1px solid #6e9cc7;flex-shrink:0}
.poster.blank{display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;color:#b5cee9;border-style:dashed}
.posteredit{display:block;background:transparent;color:#ffd15a;padding:3px 0;font-size:11px;text-align:left}
.grid-items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:9px}
.grid-items>.itemwrap{min-width:0;background:#092751;border:1px solid #376ba0;border-radius:8px;overflow:hidden}
.grid-items .row{display:flex;flex-wrap:wrap;gap:6px}
.grid-items .posterline{width:100%;display:block}
.grid-items .poster{width:100%;height:auto;aspect-ratio:2/3}
.grid-items .posterline>div:last-child{padding-top:5px}
.grid-items .center{flex:1}
.grid-items .children{margin:4px}
.grid-items .title{display:block;width:100%}
.grid-items .mini{font-size:10px}
.grid-items .itemwrap{align-self:start}
.grid-items .child{grid-template-columns:minmax(0,1fr) repeat(3,25px) 32px;padding:5px;font-size:10px}
.grid-items .child .mini{padding:3px;font-size:9px}
.grid-items .child .center input{width:15px}
.grid-items .actions{padding:6px}
.grid-items .actions button{font-size:10px;padding:6px}
.cardhead .mini{margin-left:auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;gap:8px;padding:10px;background:#041735;z-index:10}
nav button{flex:1}
nav button.active{background:#8dd5f1}
#posterStatus{color:#ffd15a;font-size:12px;line-height:1.5;margin:7px 0}
.detailslink{background:#20569b;color:white;border:1px solid #74a6e1;font-size:11px;padding:7px 9px}
@media(min-width:700px){
.grid-items{grid-template-columns:repeat(4,minmax(0,1fr))}
.row,.child{grid-template-columns:minmax(0,1fr) 65px 65px 65px 65px}
.heading{font-size:12px}
.title strong{font-size:14px}
}
</style>
</head>
<body>
<main>
<header>
<h1>📺 Classic Comcast</h1>
<div>DVD Research &amp; Collection Guide</div>
<p id="stats"></p>
<p id="seasonStats" class="muted"></p>
<p id="posterStatus"></p>
</header>

<div class="tools">
<input id="search" type="search" placeholder="Search channels, shows, movies, seasons...">
<button id="addChannel">+ Channel</button>
<button id="backup">Backup</button>
<button id="restore">Restore</button>
<button id="import">Import Shows</button>
<button id="scanPosters">↻ Find Posters</button>
</div>

<div class="view-switch">
<button id="listView">☰ List View</button>
<button id="gridView">▦ Poster Grid</button>
</div>

<div id="content"></div>
</main>

<nav>
<button id="guideTab">📺 TV Guide</button>
<button id="movieTab">🎬 Movies</button>
</nav>

<input id="restoreFile" type="file" accept=".json,application/json" hidden>
<input id="importFile" type="file" accept=".json,application/json" hidden>

<script>
'use strict';

const KEY='comcast-collection-v1';
const POSTER_KEY='comcast-posters-v1';
const VIEW_KEY='comcast-poster-view-v1';
const OPEN_KEY='comcast-open-channels-v1';
const NAV_KEY='comcast-navigation-v2';
const API='https://posters.thomasboydspam.workers.dev';

const $=id=>document.getElementById(id);
const uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2,9);
const norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
const fields=['owned','ripped','added'];
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function stored(key,fallback){
 try{return JSON.parse(localStorage.getItem(key))??fallback}
 catch{return fallback}
}

function initialData(){
 return {
  channels:[
   {id:1,num:'62',name:'Cartoon Network'},
   {id:2,num:'63',name:'Nickelodeon'},
   {id:3,num:'64',name:'Disney Channel'},
   {id:4,num:'266',name:'Toon Disney'},
   {id:74,num:'74',name:'SYFY'}
  ],
  items:[
   {id:10,channel:1,title:'Batman Beyond',type:'show',owned:false,ripped:true,added:false},
   {id:11,title:'Shrek Collection',type:'movie',owned:true,ripped:false,added:false},
   {id:12,title:'Pirates of the Caribbean Collection',type:'movie',owned:true,ripped:false,added:false},
   {id:13,title:'Harry Potter Collection',type:'movie',owned:true,ripped:false,added:false},
   {id:14,channel:74,title:'Stargate SG-1',type:'show',owned:true,ripped:false,added:false}
  ],
  collectionChildren:[]
 };
}

let data=stored(KEY,null);
if(!data||!Array.isArray(data.items)||!Array.isArray(data.channels)){
 data=initialData();
}
data.collectionChildren ||= [];
data.showDetails ||= {};
data.movieDetails ||= {};

let posters=stored(POSTER_KEY,{});
if(!posters||typeof posters!=='object')posters={};

let previous=null;
try{
 previous=JSON.parse(sessionStorage.getItem(NAV_KEY)||'null');
}catch{}

let view=previous?.view||
 (localStorage.getItem(VIEW_KEY)==='grid'?'grid':'list');
let openChannels=stored(OPEN_KEY,[]);
if(!Array.isArray(openChannels))openChannels=[];

let tab=previous?.tab==='movies'?'movies':'guide';
const opened=new Set(Array.isArray(previous?.opened)?previous.opened:[]);
let posterBusy=false;
let posterStatus='';

function save(){
 localStorage.setItem(KEY,JSON.stringify(data));
}
function savePosters(){
 localStorage.setItem(POSTER_KEY,JSON.stringify(posters));
}

function rememberPlace(){
 try{
  sessionStorage.setItem(NAV_KEY,JSON.stringify({
   tab,
   view,
   opened:[...opened],
   search:$('search').value,
   scrollY:window.scrollY
  }));
 }catch{}
}

function goToPage(url){
 rememberPlace();
 location.href=url;
}

window.addEventListener('pagehide',rememberPlace);

let scrollTimer;
window.addEventListener('scroll',()=>{
 clearTimeout(scrollTimer);
 scrollTimer=setTimeout(rememberPlace,180);
},{passive:true});

function children(parent){
 return data.collectionChildren.filter(x=>
  String(x.parentId)===String(parent.id)
 );
}

function findShow(title){
 return data.items.find(x=>
  x.type==='show'&&norm(x.title)===norm(title)
 );
}

function addChildRecord(parent,title,values={}){
 let child=children(parent).find(x=>norm(x.title)===norm(title));
 if(child)return child;

 child={
  id:uid(),
  parentId:parent.id,
  title,
  owned:!!values.owned,
  ripped:!!values.ripped,
  added:!!values.added
 };
 data.collectionChildren.push(child);
 return child;
}

function migrate(){
 let syfy=data.channels.find(ch=>String(ch.num)==='74');
 if(!syfy){
  syfy={id:uid(),num:'74',name:'SYFY'};
  data.channels.push(syfy);
 }

 let sg=findShow('Stargate SG-1');
 const old=data.items.filter(x=>
  x.type==='season'&&/^Stargate SG-1 Season\s*\d+$/i.test(x.title)
 );

 if(!sg){
  sg={
   id:uid(),channel:syfy.id,title:'Stargate SG-1',
   type:'show',owned:old.length?old.some(x=>x.owned):true,
   ripped:false,added:false
  };
  data.items.push(sg);
 }

 sg.channel=syfy.id;
 for(const season of old)addChildRecord(sg,season.title,season);

 const oldIds=new Set(old.map(x=>String(x.id)));
 data.items=data.items.filter(x=>!oldIds.has(String(x.id)));

 if(!children(sg).length){
  for(let n=1;n<=10;n++){
   addChildRecord(sg,'Stargate SG-1 Season '+n,{owned:!!sg.owned});
  }
 }

 for(const season of [...data.items.filter(x=>x.type==='season')]){
  const match=season.title.match(/^(.*?)\s+Season\s+(\d+)$/i);
  if(!match)continue;

  let parent=findShow(match[1]);
  if(!parent){
   parent={
    id:uid(),title:match[1],type:'show',
    owned:!!season.owned,
    ripped:!!season.ripped,
    added:!!season.added
   };
   data.items.push(parent);
  }

  addChildRecord(parent,season.title,season);
  data.items=data.items.filter(x=>String(x.id)!==String(season.id));
 }

 const collections=[
  ['Shrek Collection',[
   'Shrek','Shrek 2','Shrek the Third','Shrek Forever After'
  ]],
  ['Pirates of the Caribbean Collection',[
   'Pirates of the Caribbean: The Curse of the Black Pearl',
   "Pirates of the Caribbean: Dead Man's Chest",
   "Pirates of the Caribbean: At World's End",
   'Pirates of the Caribbean: On Stranger Tides',
   'Pirates of the Caribbean: Dead Men Tell No Tales'
  ]],
  ['Harry Potter Collection',[
   "Harry Potter and the Sorcerer's Stone",
   'Harry Potter and the Chamber of Secrets',
   'Harry Potter and the Prisoner of Azkaban',
   'Harry Potter and the Goblet of Fire',
   'Harry Potter and the Order of the Phoenix',
   'Harry Potter and the Half-Blood Prince',
   'Harry Potter and the Deathly Hallows – Part 1',
   'Harry Potter and the Deathly Hallows – Part 2'
  ]]
 ];

 for(const [name,titles] of collections){
  const parent=data.items.find(x=>
   x.type==='movie'&&norm(x.title)===norm(name)
  );
  if(parent){
   for(const title of titles){
    addChildRecord(parent,title,{owned:parent.owned});
   }
  }
 }
 save();
}

function el(tag,cls,text){
 const node=document.createElement(tag);
 if(cls)node.className=cls;
 if(text!==undefined)node.textContent=String(text);
 return node;
}

function button(label,cls,action){
 const b=el('button',cls,label);
 b.type='button';
 b.onclick=action;
 return b;
}

function check(item,field){
 const label=el('label','center');
 const input=el('input');
 input.type='checkbox';
 input.checked=!!item[field];
 input.setAttribute('aria-label',field+' '+item.title);

 input.onchange=()=>{
  item[field]=input.checked;
  save();
  updateStats();
 };
 label.append(input);
 return label;
}

function editTitle(item){
 const oldTitle=item.title;
 const title=prompt('Edit title',oldTitle);
 if(title===null||!title.trim())return;

 item.title=title.trim();

 if(item.type==='show'){
  if(confirm('Move this show to another channel?')){
   const num=prompt('Enter destination channel number');
   if(num){
    const channel=data.channels.find(ch=>
     String(ch.num)===num.trim()
    );
    if(channel)item.channel=channel.id;
    else alert('Channel not found');
   }
  }
 }

 if(oldTitle!==item.title){
  delete posters[String(item.id)];
  savePosters();
 }

 save();
 render();

 if(oldTitle!==item.title)scanPosters();
}

function addChild(parent){
 const title=prompt(parent.type==='show'
  ?'Season name (example: Season 2)'
  :'Movie title'
 );
 if(!title||!title.trim())return;

 addChildRecord(parent,title.trim());
 save();
 opened.add(String(parent.id));
 render();
 if(parent.type==='movie')scanPosters();
}

function movieUrl(item,parent){
 let url='./movie.html?id='+encodeURIComponent(item.id);
 if(parent){
  url+='&parent='+encodeURIComponent(parent.id);
 }
 return url;
}

function openShow(item){
 goToPage('./show.html?id='+encodeURIComponent(item.id));
}

function openMovie(item,parent){
 goToPage(movieUrl(item,parent));
}

function childRow(child,parent){
 const row=el('div','child');

 const title=button(child.title,'childname',()=>{
  openMovie(child,parent);
 });
 title.title='Open movie details';
 row.append(title);

 for(const field of fields){
  row.append(check(child,field));
 }

 row.append(button('Edit','mini',()=>editTitle(child)));
 return row;
}

function posterFor(item){
 const url=posters[String(item.id)]||
  data.movieDetails?.[String(item.id)]?.poster;

 if(url){
  const image=el('img','poster');
  image.src=url;
  image.alt=item.title+' poster';
  image.loading='lazy';
  image.onerror=()=>image.style.opacity='.3';
  return image;
 }

 return el('div','poster blank','No Poster');
}

function itemRow(item){
 const wrap=el('div','itemwrap');
 const row=el('div','row');
 const line=el('div','posterline');
 const controls=el('div');
 const isOpen=opened.has(String(item.id));

 const title=button(
  (item.type==='show'?'▶ ':isOpen?'▼ ':'▶ ')+item.title,
  'title',
  ()=>{
   if(item.type==='show')return openShow(item);

   const key=String(item.id);
   if(opened.has(key))opened.delete(key);
   else opened.add(key);
   render();
  }
 );

 const poster=posterFor(item);
 poster.style.cursor='pointer';
 poster.onclick=()=>{
  if(item.type==='show')openShow(item);
  else openMovie(item);
 };

 const editPoster=button(
  posters[String(item.id)]?'Change Poster':'+ Poster',
  'posteredit',
  ()=>{
   const url=prompt(
    'Paste a direct HTTPS image URL for '+item.title+
    '\nLeave blank to remove.',
    posters[String(item.id)]||''
   );
   if(url===null)return;

   const cleaned=url.trim();
   if(cleaned&&!cleaned.startsWith('https://')){
    alert('Please use an HTTPS image URL.');
    return;
   }

   if(cleaned)posters[String(item.id)]=cleaned;
   else delete posters[String(item.id)];

   savePosters();
   render();
  }
 );

 controls.append(title,editPoster);

 if(item.type==='movie'){
  controls.append(button('View Details','detailslink',()=>{
   openMovie(item);
  }));
 }

 line.append(poster,controls);
 row.append(line);

 const collection=item.type==='movie'&&children(item).length>0;

 for(const field of fields){
  row.append(
   collection
   ?el('span','center muted','—')
   :check(item,field)
  );
 }

 row.append(button('Edit','mini',()=>editTitle(item)));
 wrap.append(row);

 if(isOpen&&item.type==='movie'){
  const body=el('div','children');
  const list=children(item);

  for(const child of list){
   body.append(childRow(child,item));
  }

  if(!list.length){
   body.append(el('div','empty','No movies yet.'));
  }

  const actions=el('div','actions');

  actions.append(
   button('View Collection','detailslink',()=>openMovie(item)),
   button('+ Add Movie','',()=>addChild(item))
  );

  body.append(actions);
  wrap.append(body);
 }

 return wrap;
}

function addItem(type,channel){
 const title=prompt(
  type==='show'?'TV show title':'Movie or collection title'
 );
 if(!title||!title.trim())return;

 data.items.push({
  id:uid(),
  type,
  channel:channel?.id,
  title:title.trim(),
  owned:false,
  ripped:false,
  added:false
 });

 save();
 render();
 scanPosters();
}

function section(name,num,items,type,channel){
 const card=el('section','card');
 const head=el('div','cardhead');
 const arrow=el('span','arrow',channel?'▸':'');
 const number=el('span','channelnum',num);

 head.append(arrow,number);

 const grow=el('div','grow');
 grow.append(
  el('h2','',name),
  el('span','muted',items.length+' titles')
 );
 head.append(grow);

 if(channel){
  head.append(button('Edit','mini',event=>{
   event.stopPropagation();
   const n=prompt('Channel number',channel.num);
   if(n===null||!n.trim())return;

   const newName=prompt('Channel name',channel.name);
   if(newName===null||!newName.trim())return;

   channel.num=n.trim();
   channel.name=newName.trim();
   save();
   render();
  }));
 }

 card.append(head);

 const body=el('div');
 card.append(body);

 const searching=!!$('search').value.trim();

 let isOpen=!channel||searching||
  openChannels.map(String).includes(String(channel.id));

 function update(){
  body.hidden=!isOpen;
  arrow.textContent=isOpen?'▾':'▸';
 }

 if(channel){
  head.onclick=event=>{
   if(event.target.closest('button'))return;

   isOpen=!isOpen;
   update();

   if(!searching){
    const ids=new Set(openChannels.map(String));

    if(isOpen)ids.add(String(channel.id));
    else ids.delete(String(channel.id));

    openChannels=[...ids];
    localStorage.setItem(OPEN_KEY,JSON.stringify(openChannels));
   }
  };
 }

 if(view==='list'){
  const headings=el('div','row heading');

  for(const label of [
   'Title','Owned','Ripped','Added','Edit'
  ]){
   headings.append(
    el('span',label==='Title'?'':'center',label)
   );
  }
  body.append(headings);
 }

 const listing=el(
  'div',
  view==='grid'?'grid-items':'list-items'
 );

 for(const item of items){
  listing.append(itemRow(item));
 }

 body.append(listing);

 if(!items.length){
  body.append(el('div','empty','No matching titles.'));
 }

 const actions=el('div','actions');
 actions.append(button(
  type==='show'?'+ Add Show':'+ Add Movie / Collection',
  '',
  ()=>addItem(type,channel)
 ));

 body.append(actions);
 update();

 return card;
}

function updateStats(){
 const folders=new Set(
  data.items.filter(item=>
   item.type==='movie'&&children(item).length>0
  ).map(item=>String(item.id))
 );

 const main=data.items.filter(item=>
  item.type!=='season'&&!folders.has(String(item.id))
 );

 const movies=data.collectionChildren.filter(item=>
  folders.has(String(item.parentId))
 );

 const titles=[...main,...movies];

 $('stats').textContent=
  titles.filter(x=>x.owned).length+' owned / '+
  titles.length+' titles • '+
  titles.filter(x=>x.ripped).length+' ripped • '+
  titles.filter(x=>x.added).length+' added';

 const showIds=new Set(
  data.items.filter(x=>x.type==='show')
   .map(x=>String(x.id))
 );

 const seasons=data.collectionChildren.filter(x=>
  showIds.has(String(x.parentId))
 );

 $('seasonStats').textContent=
  'Seasons: '+seasons.filter(x=>x.owned).length+
  '/'+seasons.length+' owned • '+
  seasons.filter(x=>x.ripped).length+' ripped • '+
  seasons.filter(x=>x.added).length+' added';
}

function render(){
 const root=$('content');
 root.replaceChildren();

 $('guideTab').classList.toggle('active',tab==='guide');
 $('movieTab').classList.toggle('active',tab==='movies');
 $('listView').classList.toggle('active',view==='list');
 $('gridView').classList.toggle('active',view==='grid');

 const q=$('search').value.trim().toLowerCase();
 const searching=!!q;

 const matches=item=>
  item.title.toLowerCase().includes(q)||
  children(item).some(child=>
   child.title.toLowerCase().includes(q)
  );

 if(searching||tab==='guide'){
  for(const channel of data.channels){
   const all=data.items.filter(item=>
    item.type==='show'&&
    String(item.channel)===String(channel.id)
   );

   const channelMatches=
    String(channel.num).toLowerCase().includes(q)||
    channel.name.toLowerCase().includes(q);

   const filtered=!searching||channelMatches
    ?all
    :all.filter(matches);

   if(searching&&!channelMatches&&!filtered.length)continue;

   root.append(section(
    channel.name,channel.num,filtered,'show',channel
   ));
  }

  const other=data.items.filter(item=>
   item.type==='show'&&!data.channels.some(ch=>
    String(ch.id)===String(item.channel)
   )
  );

  const filtered=searching?other.filter(matches):other;

  if(filtered.length){
   root.append(section(
    'Other TV Series','📼',filtered,'show',null
   ));
  }
 }

 if(searching||tab==='movies'){
  const movies=data.items.filter(item=>item.type==='movie');
  const filtered=searching?movies.filter(matches):movies;

  if(!searching||filtered.length){
   root.append(section(
    'Movie Collection','🎬',filtered,'movie',null
   ));
  }
 }

 if(!root.children.length){
  root.append(el(
   'div','empty',
   'No matching channels, shows, seasons, movies or collections.'
  ));
 }

 updateStats();
}

function downloadJSON(obj,filename){
 const blob=new Blob(
  [JSON.stringify(obj,null,2)],
  {type:'application/json'}
 );

 const url=URL.createObjectURL(blob);
 const link=el('a');

 link.href=url;
 link.download=filename;
 document.body.append(link);
 link.click();
 link.remove();

 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function backup(){
 downloadJSON({...data,posters},'comcast-backup.json');
}

async function restore(file){
 if(!file)return;

 try{
  const restored=JSON.parse(await file.text());

  if(
   !restored||
   !Array.isArray(restored.items)||
   !Array.isArray(restored.channels)
  ){
   throw Error('Invalid backup');
  }

  if(!confirm(
   'Restore backup? A copy of your current collection will download first.'
  ))return;

  backup();
  data=restored;
  data.collectionChildren ||= [];
  data.showDetails ||= {};
  data.movieDetails ||= {};

  if(restored.posters&&typeof restored.posters==='object'){
   posters=restored.posters;
   savePosters();
  }

  migrate();
  render();
  scanPosters();
  alert('Collection restored.');
 }catch(error){
  alert('Restore failed: '+error.message);
 }
}

async function importShows(file){
 if(!file)return;

 try{
  const obj=JSON.parse(await file.text());
  let count=0;

  const entries=Array.isArray(obj)?obj:
   Array.isArray(obj.shows)?obj.shows:
   Array.isArray(obj.items)?obj.items:[];

  for(const entry of entries){
   const title=typeof entry==='string'
    ?entry
    :(entry.title||entry.name||'');

   if(!title||findShow(title))continue;

   let channel=null;

   if(typeof entry==='object'){
    const number=
     entry.channelNumber||entry.channel||entry.num;

    channel=data.channels.find(ch=>
     String(ch.num)===String(number)||
     String(ch.name).toLowerCase()===
     String(number).toLowerCase()
    );
   }

   data.items.push({
    id:uid(),
    type:'show',
    title,
    channel:channel?.id,
    owned:!!entry.owned,
    ripped:!!entry.ripped,
    added:!!entry.added
   });

   count++;
  }

  save();
  render();
  scanPosters();
  alert('Imported '+count+' new shows.');
 }catch(error){
  alert('Import failed: '+error.message);
 }
}

function resultList(body){
 if(Array.isArray(body))return body;
 if(Array.isArray(body?.results))return body.results;
 if(Array.isArray(body?.data?.results)){
  return body.data.results;
 }
 return [];
}

function resultTitle(result){
 return String(
  result?.title||
  result?.name||
  result?.original_title||
  result?.original_name||
  ''
 );
}

function resultPoster(result){
 const value=
  result?.poster||
  result?.posterUrl||
  result?.poster_url||
  result?.poster_path||
  '';

 if(typeof value!=='string'||!value)return null;

 if(value.startsWith('https://'))return value;

 if(value.startsWith('/')){
  return 'https://image.tmdb.org/t/p/w500'+value;
 }

 return null;
}

function cleanCollectionTitle(title){
 return String(title)
  .replace(
   /\s+(collection|movie collection|film collection|box set|complete series)$/i,
   ''
  )
  .trim();
}

function goodMatch(result,query){
 const actual=norm(resultTitle(result));
 const target=norm(query);

 if(!actual||!target)return false;
 return actual===target||actual===target+'collection';
}

async function posterSearch(title,type){
 const url=new URL(API+'/poster');
 url.searchParams.set('title',title);
 url.searchParams.set('type',type);

 const response=await fetch(url);

 if(!response.ok){
  throw Error('Poster service returned '+response.status);
 }

 const body=await response.json();
 const results=resultList(body);

 const match=results.find(result=>
  resultPoster(result)&&goodMatch(result,title)
 );

 return match?resultPoster(match):null;
}

async function findPoster(item){
 const type=item.type==='show'?'tv':'movie';
 const queries=[item.title];

 const isCollection=item.type==='movie'&&
  (children(item).length>0||/\bcollection\b/i.test(item.title));

 if(isCollection){
  const base=cleanCollectionTitle(item.title);

  if(norm(base)!==norm(item.title)){
   queries.push(base);
  }

  const first=children(item)[0];
  if(first?.title)queries.push(first.title);
 }

 const tried=new Set();

 for(const title of queries){
  if(!title||tried.has(norm(title)))continue;
  tried.add(norm(title));

  try{
   const poster=await posterSearch(title,type);
   if(poster)return poster;
  }catch(error){
   console.warn('Poster lookup:',title,error);
  }
 }

 return null;
}

function setPosterStatus(message){
 posterStatus=message;
 $('posterStatus').textContent=message;
}

async function scanPosters(){
 if(posterBusy)return;
 posterBusy=true;
 $('scanPosters').disabled=true;

 const pending=data.items.filter(item=>
  (item.type==='show'||item.type==='movie')&&
  !posters[String(item.id)]
 );

 let found=0;
 let processed=0;

 try{
  if(!pending.length){
   setPosterStatus('All main titles have saved posters.');
   return;
  }

  for(const item of pending){
   if(posters[String(item.id)])continue;

   processed++;
   setPosterStatus(
    'Finding posters: '+processed+'/'+pending.length+
    ' — '+item.title
   );

   const originalTitle=item.title;
   const poster=await findPoster(item);

   if(
    poster&&
    !posters[String(item.id)]&&
    item.title===originalTitle
   ){
    posters[String(item.id)]=poster;
    savePosters();
    found++;
    render();
   }

   await wait(180);
  }

  setPosterStatus(
   'Poster scan complete: '+found+' new posters saved. '+
   'Missing artwork can be set with + Poster.'
  );
 }finally{
  posterBusy=false;
  $('scanPosters').disabled=false;
 }
}
