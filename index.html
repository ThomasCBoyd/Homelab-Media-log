</style></head><body><main><header><h1>📺 Classic Comcast</h1><div>DVD Research &amp; Collection Guide</div><p id="stats"></p><p id="seasonStats" class="muted"></p></header><div class="tools"><input id="search" type="search" placeholder="Search channels, shows, movies, seasons..."><button id="addChannel">+ Channel</button><button id="backup">Backup</button><button id="restore">Restore</button><button id="import">Import Shows</button><button id="scanPosters">↻ Find Missing Posters</button></div><div class="view-switch"><button id="listView">☰ List View</button><button id="gridView">▦ Poster Grid</button></div><div id="content"></div></main><nav><button id="guideTab">📺 TV Guide</button><button id="movieTab">🎬 Movies</button></nav><input id="restoreFile" type="file" accept=".json,application/json" hidden><input id="importFile" type="file" accept=".json,application/json" hidden>
<script>
'use strict';
const KEY='comcast-collection-v1',POSTER_KEY='comcast-posters-v1',VIEW_KEY='comcast-poster-view-v1',OPEN_KEY='comcast-open-channels-v1',NAV_KEY='comcast-navigation-v2',RETRY_KEY='comcast-poster-retry-v1',API='https://posters.thomasboydspam.workers.dev';
const $=id=>document.getElementById(id),uid=()=>Date.now()+'-'+Math.random().toString(36).slice(2,9),norm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''),fields=['owned','ripped','added'],wait=ms=>new Promise(r=>setTimeout(r,ms));
function stored(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
function initialData(){return {channels:[{id:1,num:'62',name:'Cartoon Network'},{id:2,num:'63',name:'Nickelodeon'},{id:3,num:'64',name:'Disney Channel'},{id:4,num:'266',name:'Toon Disney'},{id:74,num:'74',name:'SYFY'}],items:[{id:10,channel:1,title:'Batman Beyond',type:'show',owned:false,ripped:true,added:false},{id:11,title:'Shrek Collection',type:'movie',owned:true,ripped:false,added:false},{id:12,title:'Pirates of the Caribbean Collection',type:'movie',owned:true,ripped:false,added:false},{id:13,title:'Harry Potter Collection',type:'movie',owned:true,ripped:false,added:false},{id:14,channel:74,title:'Stargate SG-1',type:'show',owned:true,ripped:false,added:false}],collectionChildren:[]}}
let data=stored(KEY,null);if(!data||!Array.isArray(data.items)||!Array.isArray(data.channels))data=initialData();data.collectionChildren ||= [];data.showDetails ||= {};data.movieDetails ||= {};data.deletedMovieChildren ||= {};
let posters=stored(POSTER_KEY,{});if(!posters||typeof posters!=='object'||Array.isArray(posters))posters={};let posterRetry=stored(RETRY_KEY,{});if(!posterRetry||typeof posterRetry!=='object')posterRetry={};
let previous=null;try{previous=JSON.parse(sessionStorage.getItem(NAV_KEY)||'null')}catch{}
let view=previous?.view||(localStorage.getItem(VIEW_KEY)==='grid'?'grid':'list'),openChannels=stored(OPEN_KEY,[]);if(!Array.isArray(openChannels))openChannels=[];let tab=previous?.tab==='movies'?'movies':'guide';const opened=new Set(Array.isArray(previous?.opened)?previous.opened:[]);
let posterBusy=false,scanRequested=false;const checkedImages=new Map(),retryDelay=24*60*60*1000;
const MANUAL_KEY='comcast-manual-posters-v1';let manualPosterIds=new Set(stored(MANUAL_KEY,[]));
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function savePosters(){localStorage.setItem(POSTER_KEY,JSON.stringify(posters))}function saveRetries(){try{localStorage.setItem(RETRY_KEY,JSON.stringify(posterRetry))}catch{}}function saveManual(){localStorage.setItem(MANUAL_KEY,JSON.stringify([...manualPosterIds]))}
function rememberPlace(){try{sessionStorage.setItem(NAV_KEY,JSON.stringify({tab,view,opened:[...opened],search:$('search').value,scrollY:window.scrollY}))}catch{}}
function goToPage(url){rememberPlace();location.href=url}window.addEventListener('pagehide',rememberPlace);let scrollTimer;window.addEventListener('scroll',()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(rememberPlace,180)},{passive:true});
function children(parent){return data.collectionChildren.filter(x=>String(x.parentId)===String(parent.id))}function findShow(title){return data.items.find(x=>x.type==='show'&&norm(x.title)===norm(title))}
function addChildRecord(parent,title,values={}){let child=children(parent).find(x=>norm(x.title)===norm(title));if(child)return child;child={id:uid(),parentId:parent.id,title,owned:!!values.owned,ripped:!!values.ripped,added:!!values.added};data.collectionChildren.push(child);return child}
function migrate(){let syfy=data.channels.find(ch=>String(ch.num)==='74');if(!syfy){syfy={id:uid(),num:'74',name:'SYFY'};data.channels.push(syfy)}let sg=findShow('Stargate SG-1');const old=data.items.filter(x=>x.type==='season'&&/^Stargate SG-1 Season\s*\d+$/i.test(x.title));if(!sg){sg={id:uid(),channel:syfy.id,title:'Stargate SG-1',type:'show',owned:old.length?old.some(x=>x.owned):true,ripped:false,added:false};data.items.push(sg)}sg.channel=syfy.id;for(const season of old)addChildRecord(sg,season.title,season);const oldIds=new Set(old.map(x=>String(x.id)));data.items=data.items.filter(x=>!oldIds.has(String(x.id)));if(!children(sg).length)for(let n=1;n<=10;n++)addChildRecord(sg,'Stargate SG-1 Season '+n,{owned:!!sg.owned});for(const season of [...data.items.filter(x=>x.type==='season')]){const match=season.title.match(/^(.*?)\s+Season\s+(\d+)$/i);if(!match)continue;let parent=findShow(match[1]);if(!parent){parent={id:uid(),title:match[1],type:'show',owned:!!season.owned,ripped:!!season.ripped,added:!!season.added};data.items.push(parent)}addChildRecord(parent,season.title,season);data.items=data.items.filter(x=>String(x.id)!==String(season.id))}save()}
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=String(text);return node}function button(label,cls,action){const b=el('button',cls,label);b.type='button';b.onclick=action;return b}
function check(item,field){const label=el('label','center'),input=el('input');input.type='checkbox';input.checked=!!item[field];input.setAttribute('aria-label',field+' '+item.title);input.onchange=()=>{item[field]=input.checked;save();updateStats()};label.append(input);return label}
function editTitle(item){const oldTitle=item.title,title=prompt('Edit title',oldTitle);if(title===null||!title.trim())return;item.title=title.trim();if(item.type==='show'&&confirm('Move this show to another channel?')){const num=prompt('Enter destination channel number');if(num){const channel=data.channels.find(ch=>String(ch.num)===num.trim());if(channel)item.channel=channel.id;else alert('Channel not found')}}if(oldTitle!==item.title&&!manualPosterIds.has(String(item.id))){delete posters[String(item.id)];delete posterRetry[String(item.id)];savePosters();saveRetries()}save();render();if(oldTitle!==item.title)requestPosterScan()}
function addChild(parent){const title=prompt(parent.type==='show'?'Season name (example: Season 2)':'Movie title');if(!title||!title.trim())return;const clean=title.trim();if(children(parent).some(x=>norm(x.title)===norm(clean))){alert('That title is already in this collection.');return}addChildRecord(parent,clean);if(parent.type==='movie'){const removed=data.deletedMovieChildren[String(parent.id)];if(Array.isArray(removed))data.deletedMovieChildren[String(parent.id)]=removed.filter(x=>x!==norm(clean))}save();opened.add(String(parent.id));render()}
function movieUrl(item,parent){let url='./movie.html?id='+encodeURIComponent(item.id);if(parent)url+='&parent='+encodeURIComponent(parent.id);return url}function openShow(item){goToPage('./show.html?id='+encodeURIComponent(item.id))}function openMovie(item,parent){goToPage(movieUrl(item,parent))}
function childRow(child,parent){const row=el('div','child'),title=button(child.title,'childname',()=>openMovie(child,parent));title.title='Open movie details';row.append(title);for(const field of fields)row.append(check(child,field));row.append(button('Edit','mini',()=>editTitle(child)));return row}
// The homepage and show detail page share the same canonical poster key.
function showDetailPoster(item){const d=data.showDetails?.[String(item.id)];return d?.tmdb?.poster||d?.poster||null}
function movieDetailPoster(item){const d=data.movieDetails?.[String(item.id)];return d?.poster||d?.tmdb?.poster||d?.metadata?.poster||null}
function savedPoster(item){const id=String(item.id);return posters[id]||(item.type==='show'?showDetailPoster(item):null)||movieDetailPoster(item)||(item.type==='movie'?children(item).map(x=>posters[String(x.id)]||movieDetailPoster(x)).find(x=>typeof x==='string'&&x.startsWith('https://')):null)||null}
function syncMoviePosters(){let changed=false;for(const item of data.items){if(item.type!=='movie')continue;const id=String(item.id),url=movieDetailPoster(item);if(!posters[id]&&typeof url==='string'&&url.startsWith('https://')){posters[id]=url;changed=true}}if(changed){try{savePosters()}catch(error){console.warn('Could not save movie posters',error)}}}
function syncShowPosters(){let changed=false;for(const item of data.items){if(item.type!=='show')continue;const id=String(item.id),url=showDetailPoster(item);if(!posters[id]&&typeof url==='string'&&url.startsWith('https://')){posters[id]=url;changed=true}}if(changed){try{savePosters()}catch(error){console.warn('Could not save synchronized posters',error)}}}
function posterFor(item){const url=savedPoster(item),id=String(item.id);let node;if(url){node=el('img','poster');node.src=url;node.alt=item.title+' poster';node.loading='lazy';node.onerror=()=>{node.style.opacity='.3'}}else node=el('div','poster blank','No Poster');node.dataset.posterId=id;return node}
function setPosterOnPage(item,url){const id=String(item.id);for(const target of document.querySelectorAll('[data-poster-id]')){if(target.dataset.posterId!==id)continue;if(target.tagName==='IMG'){target.src=url;target.style.opacity='1';continue}const img=el('img','poster');img.src=url;img.alt=item.title+' poster';img.loading='lazy';img.dataset.posterId=id;img.style.cursor='pointer';img.setAttribute('role','link');img.setAttribute('tabindex','0');img.onclick=target.onclick;img.onkeydown=target.onkeydown;img.onerror=()=>img.style.opacity='.3';target.replaceWith(img)}for(const b of document.querySelectorAll('[data-poster-edit-id]'))if(b.dataset.posterEditId===id)b.textContent='Change Poster'}
function itemRow(item){const wrap=el('div','itemwrap'),row=el('div','row'),line=el('div','posterline'),controls=el('div'),isOpen=opened.has(String(item.id));const title=button((item.type==='show'?'▶ ':isOpen?'▼ ':'▶ ')+item.title,'title',()=>{if(item.type==='show')return openShow(item);const key=String(item.id);if(opened.has(key))opened.delete(key);else opened.add(key);render()});const poster=posterFor(item);poster.style.cursor='pointer';poster.setAttribute('role','link');poster.setAttribute('tabindex','0');poster.onclick=()=>item.type==='show'?openShow(item):openMovie(item);poster.onkeydown=e=>{if(e.key==='Enter')poster.click()};const editPoster=button(savedPoster(item)?'Change Poster':'+ Poster','posteredit',()=>{const url=prompt('Paste a direct HTTPS image URL for '+item.title+'\nLeave blank to remove.',savedPoster(item)||'');if(url===null)return;const cleaned=url.trim();if(cleaned&&!cleaned.startsWith('https://')){alert('Please use an HTTPS image URL.');return}const id=String(item.id);if(cleaned){posters[id]=cleaned;manualPosterIds.add(id)}else{delete posters[id];manualPosterIds.delete(id);if(data.movieDetails?.[id]){delete data.movieDetails[id].poster;if(data.movieDetails[id].tmdb)delete data.movieDetails[id].tmdb.poster;if(data.movieDetails[id].metadata)delete data.movieDetails[id].metadata.poster;}if(data.showDetails?.[id]?.tmdb)delete data.showDetails[id].tmdb.poster;save()}delete posterRetry[id];savePosters();saveRetries();saveManual();render();if(!cleaned)requestPosterScan()});editPoster.dataset.posterEditId=String(item.id);controls.append(title,editPoster);if(item.type==='movie')controls.append(button('View Details','detailslink',()=>openMovie(item)));line.append(poster,controls);row.append(line);const collection=item.type==='movie'&&children(item).length>0;for(const field of fields)row.append(collection?el('span','center muted','—'):check(item,field));row.append(button('Edit','mini',()=>editTitle(item)));wrap.append(row);if(isOpen&&item.type==='movie'){const body=el('div','children'),list=children(item);for(const child of list)body.append(childRow(child,item));if(!list.length)body.append(el('div','empty','No movies yet.'));const actions=el('div','actions');actions.append(button('View Collection','detailslink',()=>openMovie(item)),button('+ Add Movie','',()=>addChild(item)));body.append(actions);wrap.append(body)}return wrap}
function addItem(type,channel){const title=prompt(type==='show'?'TV show title':'Movie or collection title');if(!title||!title.trim())return;data.items.push({id:uid(),type,channel:channel?.id,title:title.trim(),owned:false,ripped:false,added:false});save();render();requestPosterScan()}
function section(name,num,items,type,channel){const card=el('section','card'),head=el('div','cardhead'),arrow=el('span','arrow',channel?'▸':''),number=el('span','channelnum',num);head.append(arrow,number);const grow=el('div','grow');grow.append(el('h2','',name),el('span','muted',items.length+' titles'));head.append(grow);if(channel)head.append(button('Edit','mini',event=>{event.stopPropagation();const n=prompt('Channel number',channel.num);if(n===null||!n.trim())return;const newName=prompt('Channel name',channel.name);if(newName===null||!newName.trim())return;channel.num=n.trim();channel.name=newName.trim();save();render()}));card.append(head);const body=el('div');card.append(body);const searching=!!$('search').value.trim();let isOpen=!channel||searching||openChannels.map(String).includes(String(channel.id));function update(){body.hidden=!isOpen;arrow.textContent=isOpen?'▾':'▸'}if(channel)head.onclick=event=>{if(event.target.closest('button'))return;isOpen=!isOpen;update();if(!searching){const ids=new Set(openChannels.map(String));if(isOpen)ids.add(String(channel.id));else ids.delete(String(channel.id));openChannels=[...ids];localStorage.setItem(OPEN_KEY,JSON.stringify(openChannels))}};if(view==='list'){const headings=el('div','row heading');for(const label of ['Title','Owned','Ripped','Added','Edit'])headings.append(el('span',label==='Title'?'':'center',label));body.append(headings)}const listing=el('div',view==='grid'?'grid-items':'list-items');for(const item of items)listing.append(itemRow(item));body.append(listing);if(!items.length)body.append(el('div','empty','No matching titles.'));const actions=el('div','actions');actions.append(button(type==='show'?'+ Add Show':'+ Add Movie / Collection','',()=>addItem(type,channel)));body.append(actions);update();return card}
function updateStats(){const folders=new Set(data.items.filter(item=>item.type==='movie'&&children(item).length>0).map(item=>String(item.id)));const main=data.items.filter(item=>item.type!=='season'&&!folders.has(String(item.id)));const movies=data.collectionChildren.filter(item=>folders.has(String(item.parentId)));const titles=[...main,...movies];$('stats').textContent=titles.filter(x=>x.owned).length+' owned / '+titles.length+' titles • '+titles.filter(x=>x.ripped).length+' ripped • '+titles.filter(x=>x.added).length+' added';const showIds=new Set(data.items.filter(x=>x.type==='show').map(x=>String(x.id)));const seasons=data.collectionChildren.filter(x=>showIds.has(String(x.parentId)));$('seasonStats').textContent='Seasons: '+seasons.filter(x=>x.owned).length+'/'+seasons.length+' owned • '+seasons.filter(x=>x.ripped).length+' ripped • '+seasons.filter(x=>x.added).length+' added'}
function render(){const root=$('content');root.replaceChildren();$('guideTab').classList.toggle('active',tab==='guide');$('movieTab').classList.toggle('active',tab==='movies');$('listView').classList.toggle('active',view==='list');$('gridView').classList.toggle('active',view==='grid');const q=$('search').value.trim().toLowerCase(),searching=!!q,matches=item=>item.title.toLowerCase().includes(q)||children(item).some(child=>child.title.toLowerCase().includes(q));if(searching||tab==='guide'){for(const channel of data.channels){const all=data.items.filter(item=>item.type==='show'&&String(item.channel)===String(channel.id)),channelMatches=String(channel.num).toLowerCase().includes(q)||channel.name.toLowerCase().includes(q),filtered=!searching||channelMatches?all:all.filter(matches);if(searching&&!channelMatches&&!filtered.length)continue;root.append(section(channel.name,channel.num,filtered,'show',channel))}const other=data.items.filter(item=>item.type==='show'&&!data.channels.some(ch=>String(ch.id)===String(item.channel))),filtered=searching?other.filter(matches):other;if(filtered.length)root.append(section('Other TV Series','📼',filtered,'show',null))}if(searching||tab==='movies'){const movies=data.items.filter(item=>item.type==='movie'),filtered=searching?movies.filter(matches):movies;if(!searching||filtered.length)root.append(section('Movie Collection','🎬',filtered,'movie',null))}if(!root.children.length)root.append(el('div','empty','No matching channels, shows, seasons, movies or collections.'));updateStats()}
function downloadJSON(obj,filename){const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=el('a');link.href=url;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}function backup(){downloadJSON({...data,posters},'comcast-backup.json')}
async function restore(file){if(!file)return;try{const restored=JSON.parse(await file.text());if(!restored||!Array.isArray(restored.items)||!Array.isArray(restored.channels))throw Error('Invalid backup');if(!confirm('Restore backup? A copy of your current collection will download first.'))return;backup();data=restored;data.collectionChildren ||= [];data.showDetails ||= {};data.movieDetails ||= {};data.deletedMovieChildren ||= {};if(restored.posters&&typeof restored.posters==='object'){posters=restored.posters;savePosters()}migrate();syncShowPosters();syncMoviePosters();render();requestPosterScan();alert('Collection restored.')}catch(error){alert('Restore failed: '+error.message)}}
async function importShows(file){if(!file)return;try{const obj=JSON.parse(await file.text());let count=0;const entries=Array.isArray(obj)?obj:Array.isArray(obj.shows)?obj.shows:Array.isArray(obj.items)?obj.items:[];for(const entry of entries){const title=typeof entry==='string'?entry:(entry.title||entry.name||'');if(!title||findShow(title))continue;let channel=null;if(typeof entry==='object'){const number=entry.channelNumber||entry.channel||entry.num;channel=data.channels.find(ch=>String(ch.num)===String(number)||String(ch.name).toLowerCase()===String(number).toLowerCase())}data.items.push({id:uid(),type:'show',title,channel:channel?.id,owned:!!entry.owned,ripped:!!entry.ripped,added:!!entry.added});count++}save();render();requestPosterScan();alert('Imported '+count+' new shows.')}catch(error){alert('Import failed: '+error.message)}}
function resultList(body){if(Array.isArray(body))return body;if(Array.isArray(body?.results))return body.results;if(Array.isArray(body?.data?.results))return body.data.results;return []}function resultTitle(result){return String(result?.title||result?.name||result?.original_title||result?.original_name||'')}function resultPoster(result){const value=result?.poster||result?.posterUrl||result?.poster_url||result?.poster_path||'';if(typeof value!=='string'||!value)return null;if(value.startsWith('https://'))return value;if(value.startsWith('/'))return 'https://image.tmdb.org/t/p/w500'+value;return null}
function cleanCollectionTitle(title){return String(title).replace(/\s+(collection|movie collection|film collection|box set|complete series)$/i,'').trim()}
function matchScore(result,query){const actual=norm(resultTitle(result)),target=norm(query);if(!actual||!target)return 0;if(actual===target)return 100;if(actual===target+'collection')return 95;if(actual.startsWith(target)||target.startsWith(actual))return Math.min(actual.length,target.length)>7?65:0;return 0}
async function posterSearch(title,type){const url=new URL(API+'/poster');url.searchParams.set('title',title);url.searchParams.set('type',type);const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const response=await fetch(url,{signal:controller.signal});if(!response.ok)throw Error('Poster service returned '+response.status);const results=resultList(await response.json());const ranked=results.filter(x=>resultPoster(x)).map(x=>({item:x,score:matchScore(x,title)})).sort((a,b)=>b.score-a.score);return ranked[0]?.score>=65?resultPoster(ranked[0].item):null}finally{clearTimeout(timer)}}
async function findPoster(item){
 const type=item.type==='show'?'tv':'movie';
 const isCollection=item.type==='movie'&&(children(item).length>0||/\b(collection|box set|complete series)\b/i.test(item.title));
 const queries=[];
 if(isCollection){
  const base=cleanCollectionTitle(item.title);
  // Prefer an official franchise collection poster over a single-film poster.
  queries.push(base+' Collection',item.title);
  // Then use a real film belonging to the collection as a fallback.
  for(const child of children(item)){
   const saved=posters[String(child.id)]||movieDetailPoster(child);
   if(typeof saved==='string'&&saved.startsWith('https://'))return saved;
  }
  for(const child of children(item))queries.push(child.title);
  if(norm(base)!==norm(item.title))queries.push(base);
 }else queries.push(item.title);
 const tried=new Set();
 for(const title of queries){
  if(!title||tried.has(norm(title)))continue;
  tried.add(norm(title));
  try{const poster=await posterSearch(title,type);if(poster)return poster}
  catch(error){console.warn('Background poster lookup:',title,error)}
 }
 return null;
}
function verifyPoster(url){if(!url||!url.startsWith('https://'))return Promise.resolve(false);if(checkedImages.has(url))return checkedImages.get(url);const promise=new Promise(resolve=>{const img=new Image();let finished=false;const finish=valid=>{if(finished)return;finished=true;resolve(valid)};img.onload=()=>finish(img.naturalWidth>0);img.onerror=()=>finish(false);img.src=url;setTimeout(()=>finish(false),12000)});checkedImages.set(url,promise);return promise}
function requestPosterScan(){if(posterBusy){scanRequested=true;return}setTimeout(()=>scanPosters(false),50)}
async function scanPosters(force=false){if(posterBusy){if(force)scanRequested=true;return}posterBusy=true;const control=$('scanPosters');control.disabled=true;try{syncShowPosters();syncMoviePosters();const pending=data.items.filter(item=>(item.type==='show'||item.type==='movie')&&!savedPoster(item));for(const item of pending){if(document.visibilityState==='hidden')break;const id=String(item.id);if(savedPoster(item))continue;const previousAttempt=Number(posterRetry[id])||0;if(!force&&previousAttempt&&Date.now()-previousAttempt<retryDelay)continue;const originalTitle=item.title;try{const poster=await findPoster(item);if(poster&&item.title===originalTitle&&!savedPoster(item)){const valid=await verifyPoster(poster);if(valid&&item.title===originalTitle&&!savedPoster(item)){posters[id]=poster;try{savePosters();delete posterRetry[id];saveRetries();setPosterOnPage(item,poster)}catch(error){delete posters[id];console.warn('Could not save poster:',item.title,error)}}else{posterRetry[id]=Date.now();saveRetries()}}else{posterRetry[id]=Date.now();saveRetries()}}catch(error){posterRetry[id]=Date.now();saveRetries();console.warn('Silent poster scan failed:',item.title,error)}await wait(180)}}finally{posterBusy=false;control.disabled=false;if(scanRequested){scanRequested=false;setTimeout(()=>scanPosters(false),100)}}}
