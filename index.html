
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic Comcast Collection</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:linear-gradient(135deg,#061739,#12458d);
 color:white;
 font:14px Arial,sans-serif;
 min-height:100vh;
 padding:15px 10px 90px
}
main{max-width:900px;margin:auto}
header,.card{
 background:#103876;
 border:1px solid #76b9e8;
 border-radius:12px;
 margin-bottom:14px;
 overflow:hidden
}
header{padding:20px;border-color:#e9bc4c}
h1{color:#ffd35b;margin:0 0 8px;font-size:27px}
h2{margin:0;font-size:19px}
.muted{color:#c6dff5}
.progress{
 background:#051b42;
 border-radius:20px;
 height:12px;
 overflow:hidden;
 margin-top:8px
}
.fill{height:100%;background:#ffd35b}
.tools,.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 padding:12px 0
}
button{
 background:#ffd35b;
 color:#092550;
 border:0;
 border-radius:7px;
 padding:10px;
 font-weight:bold;
 cursor:pointer
}
input{
 padding:10px;
 border:0;
 border-radius:7px;
 min-width:0
}
.tools input[type="search"]{flex:1;min-width:140px}
.cardhead{
 display:flex;
 align-items:center;
 gap:12px;
 padding:13px;
 background:#18529a
}
.num{color:#ffd35b;font-size:24px;font-weight:bold}
.grow{flex:1}
.rows{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:460px}
th{
 background:#8dd5f1;
 color:#092550;
 text-align:left;
 padding:10px
}
td{padding:10px;border-bottom:1px solid #4276a9}
td input[type="checkbox"]{
 width:18px;
 height:18px;
 accent-color:#ffd35b
}
.actions{padding:10px}
nav{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 display:flex;
 background:#041735;
 padding:10px;
 gap:8px;
 z-index:10
}
nav button{flex:1}
nav button.active{background:#8dd5f1}
.entry{
 border-bottom:1px solid #4276a9;
 padding:10px
}
.entry-top{
 display:flex;
 align-items:center;
 flex-wrap:wrap;
 gap:8px
}
.entry-title{
 flex:1;
 min-width:130px;
 background:transparent;
 border:0;
 color:white;
 text-align:left;
 font-size:15px;
 padding:7px 2px
}
.entry-title strong{color:#fff}
.entry-title .arrow{color:#ffd35b}
.checks{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 align-items:center
}
.checks label{
 display:flex;
 align-items:center;
 gap:3px;
 font-size:12px
}
.checks input{padding:0}
.small-button{padding:6px 8px;font-size:12px}
.children{
 margin:8px 0 2px 12px;
 padding:8px;
 background:#082653;
 border-left:3px solid #ffd35b;
 border-radius:6px
}
.child-row{
 display:flex;
 align-items:center;
 flex-wrap:wrap;
 gap:8px;
 padding:9px 3px;
 border-bottom:1px solid #365e90
}
.child-name{flex:1;min-width:120px}
.child-count{color:#c6dff5;font-size:12px}
.empty{padding:15px;color:#c6dff5}
.note{font-size:12px;color:#c6dff5;padding:8px 12px}
</style>
</head>
<body>
<main>
<header>
<h1>📺 Classic Comcast</h1>
<div>DVD Research & Collection Guide</div>
<p id="stats"></p>
<div class="progress"><div id="bar" class="fill"></div></div>
<p class="muted" id="seasonStats"></p>
</header>

<div class="tools">
<input id="search" type="search" placeholder="Search collection">
<button id="addChannel">+ Channel</button>
<button id="backup">Backup</button>
<button id="restore">Restore</button>
<button id="import">Import Shows</button>
</div>

<div id="content"></div>
</main>

<nav>
<button id="guideTab" class="active">📺 TV Guide</button>
<button id="movieTab">🎬 Movies</button>
</nav>

<input id="restoreFile" type="file" accept=".json,application/json" hidden>
<input id="importFile" type="file" accept=".json,application/json" hidden>

<script>
"use strict";

const key = "comcast-collection-v1";
const $ = id => document.getElementById(id);

const defaults = {
 channels:[
  {id:1,num:"62",name:"Cartoon Network"},
  {id:2,num:"63",name:"Nickelodeon"},
  {id:3,num:"64",name:"Disney Channel"},
  {id:4,num:"266",name:"Toon Disney"}
 ],
 items:[
  {id:10,channel:1,title:"Batman Beyond",type:"show",owned:false,ripped:true,added:false},
  {id:11,title:"Shrek Collection",type:"movie",owned:true,ripped:false,added:false},
  {id:12,title:"Pirates of the Caribbean Collection",type:"movie",owned:true,ripped:false,added:false},
  {id:13,title:"Harry Potter Collection",type:"movie",owned:true,ripped:false,added:false},
  ...Array.from({length:10},(_,i)=>({
   id:20+i,
   title:"Stargate SG-1 Season "+(i+1),
   type:"season",
   owned:true,
   ripped:false,
   added:false
  }))
 ],
 collectionChildren:[]
};

let data;
try {
 data = JSON.parse(localStorage.getItem(key));
} catch(e) {}

if(!data || !Array.isArray(data.items) || !Array.isArray(data.channels)){
 data = defaults;
}

if(!Array.isArray(data.collectionChildren)){
 data.collectionChildren = [];
}

let tab = "guide";
const openItems = new Set();

function uid(){
 return "cc-"+Date.now()+"-"+Math.random().toString(36).slice(2,9);
}

function norm(value){
 return String(value||"").toLowerCase().replace(/[^a-z0-9]/g,"");
}

function save(){
 try{
  localStorage.setItem(key,JSON.stringify(data));
 }catch(e){
  alert("Unable to save. Please make a backup.");
 }
}

function snapshot(label){
 try{
  const backupKey = "comcast-recovery-"+label;
  if(!localStorage.getItem(backupKey)){
   localStorage.setItem(backupKey,JSON.stringify(data));
  }
 }catch(e){}
}

function findShow(title){
 return data.items.find(i =>
  i.type==="show" && norm(i.title)===norm(title)
 );
}

function childrenOf(id){
 return data.collectionChildren.filter(c =>
  String(c.parentId)===String(id)
 );
}

function addChild(parent,title,status={}){
 const existing = childrenOf(parent.id).find(c =>
  norm(c.title)===norm(title)
 );
 if(existing)return existing;

 const child={
  id:uid(),
  parentId:parent.id,
  title,
  owned:!!status.owned,
  ripped:!!status.ripped,
  added:!!status.added
 };
 data.collectionChildren.push(child);
 return child;
}

/* Migrate Stargate seasons into one TV show. */
function migrateStargate(){
 const pattern=/^Stargate SG-1 Season\s*(\d+)$/i;
 const old=data.items.filter(i =>
  i.type==="season" && pattern.test(i.title.trim())
 );

 if(!old.length)return;

 snapshot("before-stargate-migration");

 let series=findShow("Stargate SG-1");

 if(!series){
  series={
   id:uid(),
   title:"Stargate SG-1",
   type:"show",
   owned:old.some(i=>i.owned),
   ripped:old.every(i=>i.ripped),
   added:old.every(i=>i.added)
  };
  data.items.push(series);
 }

 for(const season of old){
  const existing=childrenOf(series.id).find(c =>
   norm(c.title)===norm(season.title)
  );

  if(!existing){
   data.collectionChildren.push({
    id:uid(),
    parentId:series.id,
    title:season.title,
    owned:!!season.owned,
    ripped:!!season.ripped,
    added:!!season.added
   });
  }
 }

 const ids=new Set(old.map(i=>String(i.id)));
 data.items=data.items.filter(i=>!ids.has(String(i.id)));
}

/* Seed movie titles only when a matching collection exists. */
function seedMovies(){
 const collections=[
  ["Harry Potter Collection",[
   "Harry Potter and the Sorcerer's Stone",
   "Harry Potter and the Chamber of Secrets",
   "Harry Potter and the Prisoner of Azkaban",
   "Harry Potter and the Goblet of Fire",
   "Harry Potter and the Order of the Phoenix",
   "Harry Potter and the Half-Blood Prince",
   "Harry Potter and the Deathly Hallows – Part 1",
   "Harry Potter and the Deathly Hallows – Part 2"
  ]],
  ["Pirates of the Caribbean Collection",[
   "Pirates of the Caribbean: The Curse of the Black Pearl",
   "Pirates of the Caribbean: Dead Man's Chest",
   "Pirates of the Caribbean: At World's End",
   "Pirates of the Caribbean: On Stranger Tides",
   "Pirates of the Caribbean: Dead Men Tell No Tales"
  ]],
  ["Shrek Collection",[
   "Shrek",
   "Shrek 2",
   "Shrek the Third",
   "Shrek Forever After"
  ]]
 ];

 for(const [name,titles] of collections){
  const parent=data.items.find(i=>
   i.type==="movie" && norm(i.title)===norm(name)
  );
  if(!parent)continue;

  for(const title of titles){
   addChild(parent,title,{
    owned:parent.owned,
    ripped:false,
    added:false
   });
  }
 }
}

/* Keep any other older standalone season records. */
function migrateOtherSeasons(){
 const seasons=data.items.filter(i=>i.type==="season");
 if(!seasons.length)return;

 snapshot("before-other-season-migration");

 for(const season of seasons){
  const match=season.title.match(/^(.*?)\s+Season\s+(\d+)$/i);
  if(!match)continue;

  const showTitle=match[1].trim();
  let parent=findShow(showTitle);

  if(!parent){
   parent={
    id:uid(),
    title:showTitle,
    type:"show",
    owned:!!season.owned,
    ripped:!!season.ripped,
    added:!!season.added
   };
   data.items.push(parent);
  }

  addChild(parent,season.title,season);
  data.items=data.items.filter(i=>
   String(i.id)!==String(season.id)
  );
 }
}

function migrate(){
 migrateStargate();
 migrateOtherSeasons();
 seedMovies();
 save();
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function create(tag,className,text){
 const el=document.createElement(tag);
 if(className)el.className=className;
 if(text!==undefined)el.textContent=text;
 return el;
}

function checkboxGroup(item,isChild=false){
 const wrapper=create("div","checks");

 for(const [field,label] of [
  ["owned","Owned"],
  ["ripped","Ripped"],
  ["added","Added"]
 ]){
  const box=create("label");
  const input=document.createElement("input");
  input.type="checkbox";
  input.checked=!!item[field];

  input.addEventListener("change",()=>{
   item[field]=input.checked;
   save();
   updateStats();
  });

  box.append(input,document.createTextNode(label));
  wrapper.appendChild(box);
 }
 return wrapper;
}

function editTitle(item){
 const name=prompt("Edit title",item.title);
 if(name===null || !name.trim())return;
 item.title=name.trim();
 save();
 render();
}

function addSeason(parent){
 const existing=childrenOf(parent.id);
 const number=existing.length+1;
 const title=prompt(
  "Season title",
  "Season "+number
 );
 if(!title || !title.trim())return;

 addChild(parent,title.trim());
 openItems.add(String(parent.id));
 save();
 render();
}

function addMovie(parent){
 const title=prompt("Movie title?");
 if(!title || !title.trim())return;
 addChild(parent,title.trim());
 openItems.add(String(parent.id));
 save();
 render();
}

function childRow(child){
 const row=create("div","child-row");
 const name=create("span","child-name",child.title);
 const checks=checkboxGroup(child,true);
 const edit=create("button","small-button","Edit");

 edit.addEventListener("click",()=>editTitle(child));
 row.append(name,checks,edit);
 return row;
}

function entryRow(item){
 const row=create("div","entry");
 const top=create("div","entry-top");
 const title=create("button","entry-title");
 const kids=childrenOf(item.id);
 const isShow=item.type==="show";

 const expanded=openItems.has(String(item.id));
 title.innerHTML=
  '<span class="arrow">'+(expanded?"▼ ":"▶ ")+'</span>'+
  "<strong>"+escapeHTML(item.title)+"</strong>";

 const count=create(
  "span",
  "child-count",
  kids.length+" "+(isShow?"seasons":"movies")
 );

 const edit=create("button","small-button","Edit");
 edit.addEventListener("click",()=>editTitle(item));

 title.addEventListener("click",()=>{
  const id=String(item.id);
  if(openItems.has(id))openItems.delete(id);
  else openItems.add(id);
  render();
 });

 top.append(title,count);

 // Collection folders are containers, not separate movies.
 // Shows keep their own overall status.
 if(isShow || kids.length===0){
  top.appendChild(checkboxGroup(item));
 }

 top.appendChild(edit);
 row.appendChild(top);

 if(expanded){
  const body=create("div","children");

  const heading=create(
   "div","muted",
   isShow?"Track individual seasons":"Track individual movies"
  );
  body.appendChild(heading);

  const sorted=[...kids].sort((a,b)=>{
   const number=s=>Number(s.title.match(/Season\s+(\d+)/i)?.[1]||0);
   if(isShow)return number(a)-number(b);
   return 0;
  });

  sorted.forEach(child=>body.appendChild(childRow(child)));

  if(!kids.length){
   body.appendChild(create(
    "div","empty",
    isShow?"No seasons added yet.":"No movies added yet."
   ));
  }

  const add=create(
   "button",
   "small-button",
   isShow?"+ Add Season":"+ Add Movie"
  );

  add.addEventListener("click",()=>{
   if(isShow)addSeason(item);
   else addMovie(item);
  });

  const actions=create("div","actions");
  actions.appendChild(add);
  body.appendChild(actions);
  row.appendChild(body);
 }

 return row;
}

function addItem(type,channel){
 const title=prompt(type==="show"?"Show title?":"Movie or collection title?");
 if(!title || !title.trim())return;

 data.items.push({
  id:uid(),
  type,
  channel,
  title:title.trim(),
  owned:false,
  ripped:false,
  added:false
 });

 save();
 render();
}

function addChannel(){
 const number=prompt("Channel number?");
 if(!number || !number.trim())return;

 const name=prompt("Channel name?");
 if(!name || !name.trim())return;

 data.channels.push({
  id:uid(),
  num:number.trim(),
  name:name.trim()
 });
 save();
 render();
}

function editChannel(channel){
 const number=prompt("Channel number",channel.num);
 if(number===null || !number.trim())return;

 const name=prompt("Channel name",channel.name);
 if(name===null || !name.trim())return;

 channel.num=number.trim();
 channel.name=name.trim();
 save();
 render();
}

function makeSection(name,num,items,type,channel){
 const section=create("section","card");
 const header=create("div","cardhead");
 const badge=create("span","num",num);
 const grow=create("div","grow");
 const heading=create("h2","",name);
 const sub=create("span","muted",items.length+" titles");

 grow.append(heading,sub);
 header.append(badge,grow);

 if(channel){
  const edit=create("button","","Edit");
  edit.addEventListener("click",()=>editChannel(channel));
  header.appendChild(edit);
 }

 section.appendChild(header);

 if(items.length){
  items.forEach(item=>section.appendChild(entryRow(item)));
 }else{
  section.appendChild(create("div","empty","No matching titles."));
 }

 const actions=create("div","actions");
 const add=create(
  "button","",
  type==="show"?"+ Add Show":"+ Add Movie / Collection"
 );

 add.addEventListener("click",()=>addItem(
  type,channel?channel.id:null
 ));

 actions.appendChild(add);
 section.appendChild(actions);
 return section;
}

function updateStats(){
 const children=data.collectionChildren;

 const movieParents=new Set(
  data.items.filter(i=>
   i.type==="movie" && childrenOf(i.id).length>0
  ).map(i=>String(i.id))
 );

 const standalone=data.items.filter(i=>
  i.type!=="season" &&
  !movieParents.has(String(i.id))
 );

 const films=children.filter(c=>
  movieParents.has(String(c.parentId))
 );

 const all=[...standalone,...films];
 const total=all.length;
 const owned=all.filter(i=>i.owned).length;
 const ripped=all.filter(i=>i.ripped).length;
 const added=all.filter(i=>i.added).length;

 $("stats").textContent=
  owned+" owned / "+total+" titles"+
  " • "+ripped+" ripped"+
  " • "+added+" added";

 $("bar").style.width=
  (total?100*owned/total:0)+"%";

 const showIds=new Set(
  data.items.filter(i=>i.type==="show")
   .map(i=>String(i.id))
 );

 const seasons=children.filter(c=>
  showIds.has(String(c.parentId))
 );

 $("seasonStats").textContent=
  "Season progress: "+
  seasons.filter(s=>s.owned).length+"/"+seasons.length+
  " owned • "+
  seasons.filter(s=>s.ripped).length+" ripped • "+
  seasons.filter(s=>s.added).length+" added to Jellyfin";
}

function render(){
 const content=$("content");
 content.replaceChildren();

 $("guideTab").classList.toggle("active",tab==="guide");
 $("movieTab").classList.toggle("active",tab==="movies");

 const q=$("search").value.trim().toLowerCase();

 if(tab==="movies"){
  const all=data.items.filter(i=>i.type==="movie");
  const items=all.filter(i=>
   i.title.toLowerCase().includes(q) ||
   childrenOf(i.id).some(c=>c.title.toLowerCase().includes(q))
  );

  content.appendChild(makeSection(
   "Movie Collection","🎬",items,"movie",null
  ));
 }else{
  for(const channel of data.channels){
   const all=data.items.filter(i=>
    i.type==="show" &&
    String(i.channel)===String(channel.id)
   );

   const items=all.filter(i=>
    i.title.toLowerCase().includes(q) ||
    childrenOf(i.id).some(c=>c.title.toLowerCase().includes(q))
   );

   if(q && !items.length &&
      !channel.name.toLowerCase().includes(q))continue;

   content.appendChild(makeSection(
    channel.name,channel.num,items,"show",channel
   ));
  }

  // Preserve shows without assigned Comcast channels.
  const unassigned=data.items.filter(i=>
   i.type==="show" &&
   !data.channels.some(c=>
    String(c.id)===String(i.channel)
   )
  ).filter(i=>
   i.title.toLowerCase().includes(q) ||
   childrenOf(i.id).some(c=>c.title.toLowerCase().includes(q))
  );

  if(unassigned.length){
   content.appendChild(makeSection(
    "Other TV Series","📼",unassigned,"show",null
   ));
  }
 }

 updateStats();
}

/* Download a complete JSON backup. */
function downloadJSON(value,filename){
 const blob=new Blob(
  [JSON.stringify(value,null,2)],
  {type:"application/json"}
 );
 const url=URL.createObjectURL(blob);
 const link=document.createElement("a");
 link.href=url;
 link.download=filename;
 document.body.appendChild(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),3000);
}

function backup(){
 downloadJSON(data,"comcast-backup.json");
}

/* Restore complete backups without discarding collection children. */
async function restoreFile(file){
 if(!file)return;

 try{
  const restored=JSON.parse(await file.text());

  if(!restored ||
     !Array.isArray(restored.items) ||
     !Array.isArray(restored.channels)){
   throw new Error("Invalid Comcast backup.");
  }

  if(!confirm(
   "Restore this backup? Your current collection will be downloaded first."
  ))return;

  backup();
  snapshot("before-restore");

  data=restored;

  if(!Array.isArray(data.collectionChildren)){
   data.collectionChildren=[];
  }

  migrate();
  render();
  alert("Backup restored.");
 }catch(e){
  alert("Restore failed: "+e.message);
 }
}

/* Import shows from an array or a shows/items object. */
async function importFile(file){
 if(!file)return;

 try{
  const parsed=JSON.parse(await file.text());
  const list=Array.isArray(parsed)?parsed:
   parsed.shows || parsed.entries || parsed.items;

  if(!Array.isArray(list)){
   throw new Error("Expected a list of shows.");
  }

  snapshot("before-import");

  let count=0;

  for(const entry of list){
   const title=typeof entry==="string"
    ?entry.trim()
    :String(entry.title||entry.name||"").trim();

   if(!title)continue;

   const network=typeof entry==="object"
    ?String(entry.network||entry.channelName||"").trim()
    :"";

   const channelNumber=typeof entry==="object"
    ?String(entry.channelNumber||entry.channel_number||
      entry.channelNum||"").trim()
    :"";

   let channel=null;

   if(network){
    channel=data.channels.find(c=>
     norm(c.name)===norm(network)
    );
   }

   if(!channel && channelNumber){
    channel=data.channels.find(c=>
     String(c.num)===channelNumber
    );
   }

   if(!channel && network){
    channel={
     id:uid(),
     num:channelNumber||"?",
     name:network
    };
    data.channels.push(channel);
   }

   const channelId=channel?channel.id:
    (typeof entry==="object" && entry.channel!=null
     ?entry.channel:null);

   const duplicate=data.items.some(i=>
    i.type==="show" &&
    norm(i.title)===norm(title) &&
    String(i.channel)===String(channelId)
   );

   if(duplicate)continue;

   data.items.push({
    id:uid(),
    type:"show",
    channel:channelId,
    title,
    owned:false,
    ripped:false,
    added:false
   });

   count++;
  }

  save();
  render();
  alert(count+" shows imported.");
 }catch(e){
  alert("Import failed: "+e.message);
 }
}

$("guideTab").addEventListener("click",()=>{
 tab="guide";
 render();
});

$("movieTab").addEventListener("click",()=>{
 tab="movies";
 render();
});

$("search").addEventListener("input",render);
$("addChannel").addEventListener("click",addChannel);
$("backup").addEventListener("click",backup);

$("restore").addEventListener("click",()=>{
 $("restoreFile").click();
});

$("import").addEventListener("click",()=>{
 $("importFile").click();
});

$("restoreFile").addEventListener("change",async e=>{
 await restoreFile(e.target.files[0]);
 e.target.value="";
});

$("importFile").addEventListener("change",async e=>{
 await importFile(e.target.files[0]);
 e.target.value="";
});

migrate();
render();
</script>
</body>
</html>
