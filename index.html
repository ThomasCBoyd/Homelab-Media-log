
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Classic Comcast Collection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#061739,#12458d);color:white;font:14px Arial,sans-serif;min-height:100vh;padding:15px 10px 80px}
main{max-width:900px;margin:auto}header,.card{background:#103876;border:1px solid #76b9e8;border-radius:12px;margin-bottom:14px;overflow:hidden}
header{padding:20px;border-color:#e9bc4c}h1{color:#ffd35b;margin:0 0 8px;font-size:27px}h2{margin:0;font-size:19px}.muted{color:#c6dff5}.progress{background:#051b42;border-radius:20px;height:12px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#ffd35b}
.tools,.actions{display:flex;gap:8px;flex-wrap:wrap;padding:12px 0}button{background:#ffd35b;color:#092550;border:0;border-radius:7px;padding:10px;font-weight:bold;cursor:pointer}input{padding:10px;border:0;border-radius:7px;min-width:0}.tools input{flex:1}
.cardhead{display:flex;align-items:center;gap:12px;padding:13px;background:#18529a}.num{color:#ffd35b;font-size:24px;font-weight:bold}.grow{flex:1}.rows{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{background:#8dd5f1;color:#092550;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid #4276a9}td input{width:18px;height:18px;accent-color:#ffd35b}.actions{padding:10px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#041735;padding:10px;gap:8px}nav button{flex:1}
</style>
</head>
<body><main>
<header><h1>📺 Classic Comcast</h1><div>DVD Research & Collection Guide</div><p id="stats"></p><div class="progress"><div id="bar" class="fill"></div></div></header>
<div class="tools"><input id="search" placeholder="Search collection"><button onclick="addChannel()">+ Channel</button><button onclick="backup()">Backup</button></div>
<div id="content"></div>
</main><nav><button onclick="setTab('guide')">📺 Guide</button><button onclick="setTab('movies')">🎬 Movies</button><button onclick="setTab('series')">📼 Series</button></nav>
<script>
const key='comcast-collection-v1';
let data;
try{data=JSON.parse(localStorage.getItem(key))}catch(e){}
if(!data)data={channels:[{id:1,num:'62',name:'Cartoon Network'},{id:2,num:'63',name:'Nickelodeon'},{id:3,num:'64',name:'Disney Channel'},{id:4,num:'266',name:'Toon Disney'}],items:[{id:10,channel:1,title:'Batman Beyond',type:'show',owned:false,ripped:true,added:false},{id:11,title:'Shrek Collection',type:'movie',owned:true,ripped:false,added:false},{id:12,title:'Pirates of the Caribbean Collection',type:'movie',owned:true,ripped:false,added:false},{id:13,title:'Harry Potter Collection',type:'movie',owned:true,ripped:false,added:false},...Array.from({length:10},(_,i)=>({id:20+i,title:'Stargate SG-1 Season '+(i+1),type:'season',owned:true,ripped:false,added:false}))]};
let tab='guide';
function save(){localStorage.setItem(key,JSON.stringify(data))}
function setTab(t){tab=t;render()}
function addChannel(){
let num=prompt('Channel number?');
if(num===null)return;
num=num.trim();
if(!num)return alert('Enter a channel number.');
let name=prompt('Channel name?');
if(name===null)return;
name=name.trim();
if(!name)return alert('Enter a channel name.');
data.channels.push({id:Date.now(),num,name});
save();render();
}
function editChannel(id){
let c=data.channels.find(x=>String(x.id)===String(id));
if(!c)return;
let num=prompt('Edit channel number',c.num);
if(num===null)return;
num=num.trim();
if(!num)return alert('Enter a channel number.');
let name=prompt('Edit channel name',c.name);
if(name===null)return;
name=name.trim();
if(!name)return alert('Enter a channel name.');
c.num=num;
c.name=name;
save();render();
}
function addItem(type,channel){
let title=prompt('Title?');
if(!title||!title.trim())return;
data.items.push({id:Date.now(),type,channel,title:title.trim(),owned:false,ripped:false,added:false});
save();render();
}
function editItem(id){
let item=data.items.find(x=>x.id===id);
if(!item)return;
let title=prompt('Edit title',item.title);
if(title===null)return;
title=title.trim();
if(!title)return alert('Title cannot be empty.');
item.title=title;
save();render();
if(item.type==='show'&&confirm('Do you also want to move this show to another channel?')){
moveShow(id);
}
}
function moveShow(id){
let item=data.items.find(x=>x.id===id);
if(!item)return;
let choices=data.channels.map(c=>c.num+' — '+c.name).join('\n');
let current=data.channels.find(c=>String(c.id)===String(item.channel));
let number=prompt('Enter the destination channel number:\n'+choices,current?current.num:'');
if(number===null)return;
let target=data.channels.find(c=>c.num===number.trim());
if(!target)return alert('That channel number was not found.');
item.channel=target.id;
save();render();
}
function toggle(id,field){
let item=data.items.find(x=>x.id===id);
if(!item)return;
item[field]=!item[field];
save();render();
}
function backup(){
let a=document.createElement('a');
let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
a.href=u;
a.download='comcast-backup.json';
a.click();
setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function render(){
let owned=data.items.filter(x=>x.owned).length,total=data.items.length;
document.getElementById('stats').textContent=owned+' owned / '+total+' entries';
document.getElementById('bar').style.width=(total?owned/total*100:0)+'%';
let q=document.getElementById('search').value.toLowerCase();
let groups=tab==='guide'
?data.channels.map(c=>({name:c.name,num:c.num,id:c.id,type:'show',items:data.items.filter(x=>x.type==='show'&&String(x.channel)===String(c.id))}))
:[{name:tab==='movies'?'Movie Collection':'TV Series',num:tab==='movies'?'🎬':'📼',type:tab==='movies'?'movie':'season',items:data.items.filter(x=>x.type===(tab==='movies'?'movie':'season'))}];
let out='';
for(let g of groups){
let items=g.items.filter(x=>x.title.toLowerCase().includes(q));
if(q&&!items.length&&!g.name.toLowerCase().includes(q))continue;
out+='<section class="card"><div class="cardhead"><span class="num">'+escapeHTML(g.num)+'</span><div class="grow"><h2>'+escapeHTML(g.name)+'</h2><span class="muted">'+g.items.length+' entries</span></div>'+(g.type==='show'?'<button onclick="editChannel('+JSON.stringify(g.id)+')">Edit</button>':'')+'</div><div class="rows"><table><thead><tr><th>Title / Show</th><th>Owned</th><th>Ripped</th><th>Added</th><th>Edit</th></tr></thead><tbody>';
for(let x of items){
out+='<tr><td>'+escapeHTML(x.title)+'</td>'+
['owned','ripped','added'].map(f=>'<td><input type="checkbox" '+(x[f]?'checked':'')+' onchange="toggle('+JSON.stringify(x.id)+',\''+f+'\')"></td>').join('')+
'<td><button onclick="editItem('+JSON.stringify(x.id)+')">Edit</button></td></tr>';
}
out+='</tbody></table></div><div class="actions"><button onclick="addItem(\''+g.type+'\','+(g.id===undefined?'null':JSON.stringify(g.id))+')">+ Add '+(g.type==='show'?'Show':g.type==='movie'?'Movie':'Season')+'</button></div></section>';
}
document.getElementById('content').innerHTML=out;
}
function escapeHTML(s){
return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
document.getElementById('search').addEventListener('input',render);
render();

/* Comcast Backup Restore — safe additive upgrade */
(function () {
  const tools = document.querySelector('.tools');
  if (!tools || document.getElementById('restoreBackup')) return;

  const button = document.createElement('button');
  button.id = 'restoreBackup';
  button.textContent = 'Restore';

  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = '.json,application/json';
  picker.style.display = 'none';

  tools.appendChild(button);
  tools.appendChild(picker);

  button.addEventListener('click', () => picker.click());

  picker.addEventListener('change', async () => {
    const file = picker.files[0];
    if (!file) return;

    try {
      const restored = JSON.parse(await file.text());

      if (
        !restored ||
        !Array.isArray(restored.channels) ||
        !Array.isArray(restored.items) ||
        !restored.channels.every(c =>
          c && c.id != null &&
          typeof c.num === 'string' &&
          typeof c.name === 'string'
        ) ||
        !restored.items.every(i =>
          i && i.id != null &&
          typeof i.title === 'string' &&
          ['show', 'movie', 'season'].includes(i.type)
        )
      ) {
        throw new Error('Invalid Comcast collection backup.');
      }

      const approved = confirm(
        'Restore ' + restored.items.length +
        ' entries and ' + restored.channels.length +
        ' channels?\n\n' +
        'Your current collection will be backed up first.'
      );
      if (!approved) return;

      // Download safety backup before replacing data.
      const safety = new Blob(
        [JSON.stringify(data, null, 2)],
        { type: 'application/json' }
      );
      const url = URL.createObjectURL(safety);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'comcast-before-restore.json';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);

      // Keep a recovery copy in browser storage.
      localStorage.setItem(
        'comcast-collection-pre-restore',
        JSON.stringify(data)
      );

      localStorage.setItem(key, JSON.stringify(restored));
      data = restored;
      render();

      alert('Collection restored successfully.');
    } catch (error) {
      alert('Restore failed: ' + error.message);
    } finally {
      picker.value = '';
    }
  });
})();

/* Comcast TV Show Inventory Import */
(function () {
  const tools = document.querySelector('.tools');
  if (!tools || document.getElementById('importShows')) return;

  const button = document.createElement('button');
  button.id = 'importShows';
  button.textContent = 'Import Shows';

  const picker = document.createElement('input');
  picker.type = 'file';
  picker.accept = '.json,application/json';
  picker.style.display = 'none';

  tools.appendChild(button);
  tools.appendChild(picker);

  button.addEventListener('click', () => picker.click());

  picker.addEventListener('change', async () => {
    const file = picker.files[0];
    if (!file) return;

    try {
      const imported = JSON.parse(await file.text());

      const rows = Array.isArray(imported)
        ? imported
        : imported.shows || imported.entries || imported.items;

      if (!Array.isArray(rows)) {
        throw new Error('No TV show list found in JSON.');
      }

      const get = (row, names) => {
        for (const name of names) {
          if (row[name] !== undefined && row[name] !== null)
            return String(row[name]).trim();
        }
        return '';
      };

      const normalized = rows.map(row => ({
        title: get(row, ['title','show','Show','name']),
        num: get(row, ['channel','Channel','channel_number','num']),
        network: get(row, ['network','Network','channel_name','Channel group'])
      })).filter(row => row.title);

      if (!normalized.length) {
        throw new Error('No recognizable show titles found.');
      }

      // Prepare changes without modifying the saved collection.
      const newChannels = [];
      const newItems = [];
      const seen = new Set(
        data.items.filter(i => i.type === 'show').map(i =>
          String(i.channel) + '|' + i.title.trim().toLowerCase()
        )
      );

      const findChannel = (num, network) => {
        const all = [...data.channels, ...newChannels];
        let channel = all.find(c =>
          num && String(c.num) === num &&
          (!network || c.name.toLowerCase() === network.toLowerCase())
        );
        if (!channel && num) {
          channel = all.find(c => String(c.num) === num);
        }
        if (!channel && network) {
          channel = all.find(c =>
            c.name.toLowerCase() === network.toLowerCase()
          );
        }
        if (!channel) {
          channel = {
            id: 'import-channel-' + (newChannels.length + 1) + '-' + Date.now(),
            num: num || 'TBD',
            name: network || 'Network research needed'
          };
          newChannels.push(channel);
        }
        return channel;
      };

      for (const row of normalized) {
        const channel = findChannel(row.num, row.network);
        const identity = String(channel.id) + '|' + row.title.toLowerCase();
        if (seen.has(identity)) continue;
        seen.add(identity);

        newItems.push({
          id: 'import-show-' + newItems.length + '-' + Date.now(),
          channel: channel.id,
          title: row.title,
          type: 'show',
          owned: false,
          ripped: false,
          added: false
        });
      }

      if (!confirm(
        'Import preview:\n' +
        normalized.length + ' source entries\n' +
        newItems.length + ' new shows\n' +
        newChannels.length + ' new channels\n\n' +
        'Existing entries and tracking statuses will be kept.\n\n' +
        'Continue?'
      )) return;

      // Create a browser recovery point before import.
      localStorage.setItem(
        'comcast-collection-pre-import',
        JSON.stringify(data)
      );

      const next = {
        ...data,
        channels: [...data.channels, ...newChannels],
        items: [...data.items, ...newItems]
      };

      localStorage.setItem(key, JSON.stringify(next));
      data = next;
      render();

      alert('Imported ' + newItems.length + ' new TV shows.');
    } catch (error) {
      alert('Import failed: ' + error.message);
    } finally {
      picker.value = '';
    }
  });
})();

/* Classic Comcast: expandable collections, additive upgrade */
(function () {
  if (document.getElementById('comcast-expandable-style')) return;

  const style = document.createElement('style');
  style.id = 'comcast-expandable-style';
  style.textContent = `
    .cc-collection{margin:10px;border:1px solid #4276a9;border-radius:9px;overflow:hidden;background:#0b2d61}
    .cc-collection summary{cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px;background:#18529a;list-style:none}
    .cc-collection summary::-webkit-details-marker{display:none}
    .cc-collection summary:before{content:'▸';color:#ffd35b}
    .cc-collection[open] summary:before{content:'▾'}
    .cc-collection .cc-count{color:#c6dff5;font-size:12px}
    .cc-collection .cc-body{overflow-x:auto}
    .cc-collection table{min-width:560px}
    .cc-collection .cc-actions{padding:10px;display:flex;gap:8px;flex-wrap:wrap}
  `;
  document.head.appendChild(style);

  // Save individual movies inside the existing collection data.
  if (!Array.isArray(data.collectionChildren)) {
    data.collectionChildren = [];
  }

  const children = data.collectionChildren;
  const uid = () => 'cc-child-' + Date.now() + '-' +
    Math.random().toString(36).slice(2, 9);

  const norm = s => String(s || '')
    .toLowerCase().replace(/[^a-z0-9]/g, '');

  function seed(parentTitle, names) {
    const parent = data.items.find(i =>
      norm(i.title) === norm(parentTitle)
    );
    if (!parent) return;

    for (const name of names) {
      if (!children.some(c =>
        String(c.parentId) === String(parent.id) &&
        norm(c.title) === norm(name)
      )) {
        children.push({
          id: uid(),
          parentId: parent.id,
          title: name,
          owned: !!parent.owned,
          ripped: false,
          added: false
        });
      }
    }
  }

  seed('Harry Potter Collection', [
    "Harry Potter and the Sorcerer's Stone",
    'Harry Potter and the Chamber of Secrets',
    'Harry Potter and the Prisoner of Azkaban',
    'Harry Potter and the Goblet of Fire',
    'Harry Potter and the Order of the Phoenix',
    'Harry Potter and the Half-Blood Prince',
    'Harry Potter and the Deathly Hallows - Part 1',
    'Harry Potter and the Deathly Hallows - Part 2'
  ]);

  seed('Pirates of the Caribbean Collection', [
    'The Curse of the Black Pearl',
    "Dead Man's Chest",
    "At World's End",
    'On Stranger Tides',
    'Dead Men Tell No Tales'
  ]);

  seed('Shrek Collection', [
    'Shrek',
    'Shrek 2',
    'Shrek the Third',
    'Shrek Forever After'
  ]);

  save();

  const originalRender = render;

  function expandableRender() {
    const open = new Set(
      [...document.querySelectorAll('details.cc-collection[open]')]
        .map(el => el.dataset.parent)
    );

    originalRender();

    if (tab !== 'movies' && tab !== 'series') return;

    const container = document.getElementById('content');
    const rows = [...container.querySelectorAll('tbody tr')];
    const type = tab === 'movies' ? 'movie' : 'season';
    const query = document.getElementById('search').value.toLowerCase();

    const parents = data.items.filter(item =>
      item.type === type &&
      (!query || item.title.toLowerCase().includes(query))
    );

    parents.forEach((parent, index) => {
      const row = rows[index];
      if (!row) return;

      const kids = children.filter(child =>
        String(child.parentId) === String(parent.id)
      );

      if (tab === 'series' && !kids.length) return;

      const details = document.createElement('details');
      details.className = 'cc-collection';
      details.dataset.parent = String(parent.id);
      details.open = open.has(String(parent.id));

      const summary = document.createElement('summary');
      const label = document.createElement('strong');
      label.textContent = parent.title;

      const count = document.createElement('span');
      count.className = 'cc-count';
      count.textContent = kids.length + ' entries';

      summary.append(label, count);
      details.appendChild(summary);

      const body = document.createElement('div');
      body.className = 'cc-body';

      const table = document.createElement('table');
      table.innerHTML =
        '<thead><tr><th>Movie / Season</th>' +
        '<th>Owned</th><th>Ripped</th>' +
        '<th>Added</th><th>Edit</th></tr></thead>';

      const tbody = document.createElement('tbody');

      kids.forEach(child => {
        const tr = document.createElement('tr');
        const nameCell = document.createElement('td');
        nameCell.textContent = child.title;
        tr.appendChild(nameCell);

        ['owned', 'ripped', 'added'].forEach(field => {
          const cell = document.createElement('td');
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = !!child[field];

          checkbox.addEventListener('change', () => {
            child[field] = checkbox.checked;
            save();
          });

          cell.appendChild(checkbox);
          tr.appendChild(cell);
        });

        const editCell = document.createElement('td');
        const edit = document.createElement('button');
        edit.textContent = 'Edit';

        edit.addEventListener('click', () => {
          const name = prompt('Edit title', child.title);
          if (name === null || !name.trim()) return;
          child.title = name.trim();
          save();
          expandableRender();
        });

        editCell.appendChild(edit);
        tr.appendChild(editCell);
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      body.appendChild(table);

      const actions = document.createElement('div');
      actions.className = 'cc-actions';

      const add = document.createElement('button');
      add.textContent = '+ Add Movie / Season';

      add.addEventListener('click', () => {
        const title = prompt('Movie or season title?');
        if (!title || !title.trim()) return;

        children.push({
          id: uid(),
          parentId: parent.id,
          title: title.trim(),
          owned: false,
          ripped: false,
          added: false
        });

        save();
        expandableRender();
      });

      actions.appendChild(add);
      body.appendChild(actions);
      details.appendChild(body);

      const detailRow = document.createElement('tr');
      const detailCell = document.createElement('td');
      detailCell.colSpan = 5;
      detailCell.style.padding = '0';
      detailCell.appendChild(details);
      detailRow.appendChild(detailCell);

      row.after(detailRow);
    });
  }

  render = expandableRender;
  expandableRender();
})();

</script></body></html>
